name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR supersedes the running check.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p .

      - name: Frontend tests
        run: |
          node --test scripts/release-version.test.mjs
          npm test

      # The disk-image eject tests and FSEvents watcher tests are #[ignore]d
      # (they mount volumes / depend on FSEvents timing); run them locally:
      #   cargo test --test eject -- --ignored --test-threads=1
      #   cargo test --lib watcher -- --ignored
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
