<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fazi settings · C · Page</title>
    <link rel="stylesheet" href="shared/settings-base.css" />
    <style>
      /*
       * C · Page
       * Every setting on one scrolling page, like a well-made preferences
       * document. A contents column tracks where you are and jumps between
       * sections; rows are a two-column form (label and explanation left,
       * control right) with no nested cards. Scrolling replaces clicking
       * through panes, and search filters the page in place.
       */
      .doc {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(1040px, calc(100% - 80px));
        height: calc(100% - 64px);
        display: flex;
        border-radius: 12px;
        overflow: hidden;
        background: var(--pane);
        box-shadow: var(--shadow);
      }

      /* ------------------------------------------------------- contents */

      .toc {
        width: 220px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        padding: 22px 14px 16px 22px;
        background: var(--sunken);
        box-shadow: inset -0.5px 0 0 var(--border);
      }
      .toc h2 {
        margin: 0 0 16px 10px;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      .toc-item {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 28px;
        padding: 0 10px;
        border-radius: 6px;
        color: var(--text-2);
        text-align: left;
      }
      .toc-item:hover {
        color: var(--text);
        background: var(--hover);
      }
      .toc-item::before {
        content: "";
        position: absolute;
        left: -10px;
        top: 7px;
        bottom: 7px;
        width: 2.5px;
        border-radius: 2px;
        background: transparent;
      }
      .toc-item.is-on {
        color: var(--text);
        font-weight: 600;
      }
      .toc-item.is-on::before {
        background: var(--accent);
      }
      .toc-item span {
        flex: 1;
      }
      .toc-item small {
        color: var(--accent);
        font-size: 11px;
        font-weight: 600;
      }
      .toc-grow {
        flex: 1;
      }
      .toc-keys {
        padding: 0 10px;
        font-size: 11px;
        line-height: 1.7;
        color: var(--text-3);
      }
      .toc-keys kbd {
        color: var(--text-2);
      }

      /* ------------------------------------------------------- page */

      .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 56px;
        flex-shrink: 0;
        padding: 0 16px 0 40px;
        box-shadow: inset 0 -0.5px 0 var(--border);
      }
      .find {
        flex: 1;
        max-width: 420px;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 10px;
        border-radius: 8px;
        background: var(--seg-bg);
        color: var(--text-3);
      }
      .find:focus-within {
        box-shadow: 0 0 0 1.5px var(--accent);
      }
      .find input {
        flex: 1;
        min-width: 0;
        border: 0;
        background: transparent;
        outline: none;
        font-size: 13.5px;
        color: var(--text);
      }
      .find kbd {
        color: var(--text-3);
        font-size: 11px;
      }
      .top-grow {
        flex: 1;
      }
      .changed {
        color: var(--text-3);
        font-size: 12px;
      }
      .close {
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 7px;
        color: var(--text-2);
      }
      .close:hover {
        background: var(--hover);
        color: var(--text);
      }
      .scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        scroll-behavior: smooth;
        padding: 8px 40px 50vh;
      }
      .sec {
        padding-top: 30px;
      }
      .sec-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 4px;
      }
      .sec-head .ic {
        color: var(--accent);
      }
      .sec-head h2 {
        margin: 0;
        font-size: 20px;
        font-weight: 650;
        letter-spacing: -0.015em;
      }
      .sec-blurb {
        margin: 0 0 6px 28px;
        color: var(--text-3);
      }

      /* Groups become sub-heads; rows become a two-column form. */
      .scroll .s-group {
        margin-top: 14px;
      }
      .scroll .s-group-title {
        margin: 0 0 0 28px;
        padding: 10px 0 6px;
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--text-3);
      }
      .scroll .s-card {
        background: none;
        box-shadow: none;
        border-radius: 0;
        margin-left: 28px;
      }
      .scroll .s-row,
      .scroll .s-row.is-block {
        display: grid;
        grid-template-columns: minmax(200px, 270px) 1fr;
        align-items: start;
        gap: 28px;
        padding: 12px 0;
      }
      .scroll .s-row + .s-row {
        box-shadow: inset 0 0.5px 0 var(--border);
      }
      .scroll .s-ctl {
        display: flex;
        min-height: 22px;
        align-items: center;
      }
      .scroll .s-row.is-block .s-ctl {
        display: block;
      }
      .scroll .s-row.is-cheats {
        display: block;
      }
      .scroll .s-row.is-cheats .s-ctl,
      .scroll .s-row.is-cheats > .s-cheats {
        margin-left: calc(min(270px, 30%) + 28px);
      }
      .scroll .s-preview-wrap {
        margin: 16px 0 0 28px;
        display: grid;
        grid-template-columns: minmax(200px, 270px) 1fr;
        gap: 28px;
      }
      .scroll .s-preview-cap {
        grid-row: 1;
        grid-column: 1;
        margin: 0;
        text-align: left;
        font-size: 12px;
        color: var(--text-3);
      }
      .scroll .s-preview {
        grid-column: 2;
        max-width: 480px;
      }
      .scroll .s-result-group .s-group-title {
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <script src="shared/settings-core.js"></script>
    <script>
      (() => {
        const F = window.FaziSettings;
        const { icon, esc } = F;
        let current = "general";
        let pendingScroll = null;

        function toc() {
          const q = F.U.query.trim();
          return `<nav class="toc" aria-label="Contents"><h2>Settings</h2>${F.SECTIONS.map((s) => {
            const n = F.modifiedIn(s.id);
            return `<button class="toc-item ${s.id === current && !q ? "is-on" : ""}" data-jump="${s.id}">${icon(s.icon, 14)}<span>${s.title}</span>${n ? `<small>${n}</small>` : ""}</button>`;
          }).join("")}<div class="toc-grow"></div>
          <div class="toc-keys"><kbd>⌘F</kbd> search · <kbd>⌘↑ ⌘↓</kbd> sections<br><kbd>Esc</kbd> clears search, then closes</div></nav>`;
        }

        function page() {
          const q = F.U.query.trim();
          if (q) return F.searchResults({ sectionLink: true });
          return F.SECTIONS.map(
            (s) => `<section class="sec" id="sec-${s.id}" data-sec="${s.id}">
              <div class="sec-head">${icon(s.icon, 18)}<h2>${s.title}</h2></div><p class="sec-blurb">${s.blurb}</p>
              ${F.sectionBody(s.id)}</section>`,
          ).join("");
        }

        /** Offset of a section inside the scroller's content. */
        const top = (el, sc) => el.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop;

        function jump(id, smooth = true) {
          const el = document.getElementById(`sec-${id}`);
          const sc = document.querySelector(".scroll");
          if (!el || !sc) return;
          sc.style.scrollBehavior = smooth ? "smooth" : "auto";
          sc.scrollTop = top(el, sc) - 8;
          current = id;
          syncToc();
        }

        function syncToc() {
          document.querySelectorAll(".toc-item").forEach((b) => b.classList.toggle("is-on", b.dataset.jump === current && !F.U.query.trim()));
        }

        function onScroll(e) {
          const sc = e.target;
          let id = F.SECTIONS[0].id;
          for (const el of sc.querySelectorAll("[data-sec]")) if (top(el, sc) - sc.scrollTop < 120) id = el.dataset.sec;
          if (id !== current) {
            current = id;
            syncToc();
          }
        }

        F.mount({
          backdrop: true,
          init(api, params) {
            if (params.has("section")) pendingScroll = params.get("section");
          },
          render() {
            if (!F.U.open) return `<button class="s-reopen" data-open>Settings <kbd>⌘,</kbd></button>`;
            const n = F.totalModified();
            return `<div class="s-scrim" data-close></div><div class="doc" role="dialog" aria-label="Settings">${toc()}
              <div class="main"><div class="top"><label class="find">${icon("search", 14)}<input id="s-search" data-search placeholder="Search all settings and shortcuts" value="${esc(F.U.query)}" aria-label="Search settings"/>${F.U.query ? "" : "<kbd>⌘F</kbd>"}</label>
                <span class="top-grow"></span><span class="changed">${n ? `${n} changed from default` : "All defaults"}</span>
                <button class="close" data-close aria-label="Close settings" title="Close (Esc)">${icon("x", 15)}</button></div>
              <div class="scroll" data-scroll-key="page-${F.U.query.trim() ? "q" : "all"}">${page()}</div></div></div>`;
          },
          afterRender() {
            const sc = document.querySelector(".scroll");
            if (sc) sc.onscroll = onScroll;
            if (pendingScroll && sc && !F.U.query.trim()) {
              const id = pendingScroll;
              pendingScroll = null;
              jump(id, false);
            }
          },
          onClick(e) {
            const j = e.target.closest("[data-jump]");
            if (j) {
              if (F.U.query.trim()) {
                F.U.query = "";
                pendingScroll = j.dataset.jump;
                F.render();
              } else jump(j.dataset.jump);
              return true;
            }
            const c = e.target.closest("[data-close]");
            if (c && c === e.target.closest("button,.s-scrim")) {
              F.U.open = false;
              F.render();
              return true;
            }
            if (e.target.closest("[data-open]")) {
              F.U.open = true;
              F.render();
              return true;
            }
          },
          goto(id) {
            pendingScroll = id;
          },
          onKey(e) {
            if (e.metaKey && (e.key === "ArrowUp" || e.key === "ArrowDown") && F.U.open && !F.U.query.trim()) {
              const i = F.SECTIONS.findIndex((s) => s.id === current);
              const j = Math.max(0, Math.min(F.SECTIONS.length - 1, i + (e.key === "ArrowUp" ? -1 : 1)));
              e.preventDefault();
              jump(F.SECTIONS[j].id);
              return true;
            }
          },
        });
      })();
    </script>
  </body>
</html>
